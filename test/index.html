<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owen's Docs Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond&family=JetBrains+Mono&family=Inter:wght@400;700&family=Roboto+Slab&family=Caveat:wght@700&display=swap');
        
        #edit-content { min-height: 600px; outline: none; line-height: 1.6; position: relative; }
        .resizable-img { position: relative; display: inline-block; margin: 15px 0; line-height: 0; max-width: 100%; }
        .resizable-img img { width: 100%; border-radius: 8px; }
        
        /* Side Panel Logic */
        #ai-side-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(100%);
        }
        #ai-side-panel.open { transform: translateX(0); }
        
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 13px; margin-bottom: 8px; }
        .ai-bubble { background: #f1f5f9; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user-bubble { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .font-sans { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'EB Garamond', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-slab { font-family: 'Roboto Slab', serif; }
        .font-hand { font-family: 'Caveat', cursive; font-size: 1.4rem; }

        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .recording { color: #ef4444; animation: pulse-red 1s infinite; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans overflow-x-hidden">

    <div id="toast-container" class="fixed bottom-5 left-5 z-[100] flex flex-col gap-2"></div>

    <div id="login-screen" class="fixed inset-0 bg-white z-[70] flex flex-col items-center justify-center">
        <h1 class="text-5xl font-black text-slate-800 mb-6 italic tracking-tighter">Owen's Docs</h1>
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-2xl font-bold shadow-xl active:scale-95 transition-all">
            <i class="fab fa-google mr-2"></i> Sign in with Google
        </button>
    </div>

    <nav id="main-nav" class="hidden bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-10">
        <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Owen's docs</h2>
        <button id="logout-btn" class="text-red-500 font-black text-[10px] tracking-widest uppercase">Logout</button>
    </nav>

    <main id="dashboard" class="hidden max-w-6xl mx-auto p-8">
        <div class="flex justify-between items-center mb-12">
            <h3 class="text-3xl font-bold text-slate-900">Workspace</h3>
            <button id="create-btn" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:shadow-blue-200 transition-all">
                <i class="fas fa-plus mr-2"></i> New Doc
            </button>
        </div>
        <div id="docs-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <div id="editor-modal" class="fixed inset-0 bg-white hidden z-[60] flex overflow-hidden">
        
        <div class="flex-1 flex flex-col relative h-full">
            <div class="p-4 border-b flex justify-between items-center bg-white">
                <div class="flex items-center gap-4 flex-1">
                    <button id="close-editor" class="text-slate-400 hover:text-slate-900"><i class="fas fa-arrow-left"></i></button>
                    <input id="edit-title" type="text" class="text-xl font-bold outline-none w-full" placeholder="Untitled">
                </div>
                <div class="flex items-center gap-2">
                    <button id="export-pdf-btn" class="p-2 text-slate-400 hover:text-blue-600"><i class="fas fa-file-pdf"></i></button>
                    <button id="toggle-ai-panel" class="bg-indigo-100 text-indigo-600 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-indigo-200 transition">
                        <i class="fas fa-robot mr-2"></i> Owen AI
                    </button>
                </div>
            </div>

            <div class="bg-slate-50 border-b p-2 flex gap-2 justify-center">
                <select id="font-select" class="text-xs font-bold border rounded-lg px-2 bg-white">
                    <option value="font-sans">Modern</option>
                    <option value="font-serif">Classic</option>
                    <option value="font-mono">Mono</option>
                    <option value="font-hand">Hand</option>
                </select>
                <button onclick="document.execCommand('bold')" class="p-2 hover:bg-slate-200 rounded"><i class="fas fa-bold"></i></button>
                <button onclick="document.execCommand('italic')" class="p-2 hover:bg-slate-200 rounded"><i class="fas fa-italic"></i></button>
                <button id="voice-dictate-btn" class="p-2 hover:bg-red-50 text-slate-600 rounded" title="Speak to Write"><i class="fas fa-microphone"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto" id="editor-container">
                <div id="edit-content" contenteditable="true" class="max-w-3xl mx-auto p-12 md:p-20 outline-none"></div>
            </div>
        </div>

        <div id="ai-side-panel" class="w-80 border-l bg-white flex flex-col h-full shadow-2xl fixed right-0 top-0 z-[70] md:relative md:transform-none">
            <div class="p-4 border-b flex justify-between items-center bg-indigo-600 text-white">
                <span class="font-black text-xs uppercase tracking-widest">Owen AI Assistant</span>
                <button id="close-ai-panel" class="md:hidden"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="chat-feed" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-slate-50">
                <div class="ai-bubble chat-bubble">Hey Owen! I can help you write, fix grammar, or even read your doc out loud. What's up?</div>
            </div>

            <div class="p-2 grid grid-cols-2 gap-2 border-t bg-white">
                <button id="ai-fix-grammar" class="text-[10px] font-bold bg-slate-100 p-2 rounded-lg hover:bg-blue-50">✨ Fix Grammar</button>
                <button id="ai-read-aloud" class="text-[10px] font-bold bg-slate-100 p-2 rounded-lg hover:bg-blue-50">🔊 Read Doc</button>
            </div>

            <div class="p-4 border-t bg-white">
                <div class="relative">
                    <textarea id="ai-input" rows="2" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 ring-indigo-500 resize-none" placeholder="Ask AI..."></textarea>
                    <button id="send-ai-btn" class="absolute right-3 bottom-3 text-indigo-600 hover:scale-110 transition"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqnZfCWAwU7KXJEGunzYAP5qfZJQVvExQ",
            authDomain: "imcrabpd.firebaseapp.com",
            databaseURL: "https://imcrabpd-default-rtdb.firebaseio.com",
            projectId: "imcrabpd",
            storageBucket: "imcrabpd.firebasestorage.app",
            messagingSenderId: "555027239107",
            appId: "1:555027239107:web:d4d58affb9b3dea996d276"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();
        const GROQ_API_KEY = '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';
        
        let currentDocId = null;
        let chatHistory = [];

        // --- AUTH ---
        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-nav').classList.remove('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadDashboard(user.email);
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

        // --- DASHBOARD ---
        function loadDashboard(email) {
            onValue(ref(db, 'docs'), (s) => {
                const container = document.getElementById('docs-container');
                container.innerHTML = '';
                const data = s.val() || {};
                for (let id in data) {
                    if (data[id].owner === email) {
                        const card = document.createElement('div');
                        card.className = "bg-white p-6 rounded-2xl shadow-sm border hover:border-blue-500 cursor-pointer transition";
                        card.innerHTML = `<h4 class="font-bold">${data[id].title || 'Untitled'}</h4>`;
                        card.onclick = () => openEditor(id, data[id]);
                        container.appendChild(card);
                    }
                }
            });
        }

        document.getElementById('create-btn').onclick = () => {
            const n = push(ref(db, 'docs'));
            const d = { title: "New Document", content: "Start writing...", owner: auth.currentUser.email };
            set(n, d).then(() => openEditor(n.key, d));
        };

        // --- EDITOR ---
        function openEditor(id, data) {
            currentDocId = id;
            document.getElementById('edit-title').value = data.title;
            document.getElementById('edit-content').innerHTML = data.content;
            document.getElementById('editor-modal').classList.remove('hidden');
        }

        document.getElementById('close-editor').onclick = () => document.getElementById('editor-modal').classList.add('hidden');

        // --- VOICE STUFF (TALK AND SHIT) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            
            document.getElementById('voice-dictate-btn').onclick = () => {
                recognition.start();
                document.getElementById('voice-dictate-btn').classList.add('recording');
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.execCommand('insertText', false, text + ' ');
                document.getElementById('voice-dictate-btn').classList.remove('recording');
            };
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // --- AI SIDE PANEL LOGIC ---
        const panel = document.getElementById('ai-side-panel');
        document.getElementById('toggle-ai-panel').onclick = () => panel.classList.toggle('open');
        document.getElementById('close-ai-panel').onclick = () => panel.classList.remove('open');

        async function callAI(prompt, systemMsg = "You are a helpful assistant named Owen AI.") {
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: systemMsg },
                            ...chatHistory,
                            { role: 'user', content: prompt }
                        ]
                    })
                });
                const resData = await response.json();
                return resData.choices[0].message.content;
            } catch (e) { return "Error connecting to AI brain."; }
        }

        function addChat(role, text) {
            const feed = document.getElementById('chat-feed');
            const b = document.createElement('div');
            b.className = `chat-bubble ${role === 'ai' ? 'ai-bubble' : 'user-bubble'}`;
            b.innerText = text;
            feed.appendChild(b);
            feed.scrollTop = feed.scrollHeight;
            chatHistory.push({ role: role === 'ai' ? 'assistant' : 'user', content: text });
            if (chatHistory.length > 10) chatHistory.shift();
        }

        document.getElementById('send-ai-btn').onclick = async () => {
            const input = document.getElementById('ai-input');
            const val = input.value.trim();
            if (!val) return;
            
            addChat('user', val);
            input.value = '';
            
            const docContext = document.getElementById('edit-content').innerText;
            const reply = await callAI(`Context of document: ${docContext.substring(0, 2000)}\n\nUser asks: ${val}`);
            addChat('ai', reply);
            speak(reply); // Make it talk!
        };

        document.getElementById('ai-read-aloud').onclick = () => {
            const text = document.getElementById('edit-content').innerText;
            addChat('ai', "Reading your document out loud...");
            speak(text);
        };

        document.getElementById('ai-fix-grammar').onclick = async () => {
            addChat('ai', "Analyzing grammar...");
            const text = document.getElementById('edit-content').innerText;
            const fixed = await callAI(`Fix grammar and spelling for this text. Return ONLY the corrected text:\n\n${text}`, "You are a professional editor.");
            document.getElementById('edit-content').innerText = fixed;
            addChat('ai', "Grammar fixed!");
        };

        // --- AUTO SAVE ---
        document.getElementById('edit-content').oninput = () => {
            if (!currentDocId) return;
            update(ref(db, `docs/${currentDocId}`), {
                content: document.getElementById('edit-content').innerHTML,
                title: document.getElementById('edit-title').value
            });
        };
    </script>
</body>
</html>
